[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "highwall"
version = "0.11.0"
description = "Fail-closed HTTP application firewall and reverse proxy"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "HighWall contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "coverage==7.16.2",
    "mypy==2.4.0",
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://github.com/Fallen-leaves089/highwall"
Repository = "https://github.com/Fallen-leaves089/highwall"
Issues = "https://github.com/Fallen-leaves089/highwall/issues"
Security = "https://github.com/Fallen-leaves089/highwall/security/policy"

[project.scripts]
highwall = "highwall.cli:main"

[tool.setuptools]
packages = ["highwall"]

[tool.setuptools.package-data]
highwall = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B008", "B017"]

[tool.mypy]
python_version = "3.10"
files = ["highwall"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["highwall"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 80
