[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "l4wall"
version = "0.1.0"
description = "Fail-closed TCP gateway with connection-level defense"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "L4Wall contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Fallen-leaves089/highwall/tree/main/subprojects/l4wall"
Repository = "https://github.com/Fallen-leaves089/highwall"
Issues = "https://github.com/Fallen-leaves089/highwall/issues"
Security = "https://github.com/Fallen-leaves089/highwall/security/policy"

[project.scripts]
l4wall = "l4wall.cli:main"

[tool.setuptools]
packages = ["l4wall"]

[tool.setuptools.package-data]
l4wall = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B008", "B017"]

[tool.mypy]
python_version = "3.10"
files = ["l4wall"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
