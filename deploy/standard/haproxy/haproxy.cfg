global
    log stdout format raw local0
    maxconn 4096
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 1
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 30s
    maxconn 2048

frontend edge
    bind *:8080

    # Only the edge may define client identity. Never forward a client-supplied
    # forwarding header into HighWall.
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header Forwarded
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    default_backend highwall

backend highwall
    server highwall 172.30.0.20:18090 check inter 5s fall 3 rise 2
