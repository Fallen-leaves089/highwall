name: highwall-honeypot

services:
  ssh-live:
    build:
      context: ./ssh
      args:
        HONEYPOT_SSH_PASSWORD: ${HONEYPOT_SSH_PASSWORD:-highwall-decoy-only}
    container_name: highwall-honeypot-ssh
    ports:
      - "127.0.0.1:${HONEYPOT_SSH_PORT:-12222}:2222"
    networks:
      honeypot-ssh:
        ipv4_address: 172.30.0.10
    init: true
    read_only: true
    tmpfs:
      - /run:size=16m,mode=755
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web-live:
    build:
      context: ./web
    container_name: highwall-honeypot-web
    ports:
      - "127.0.0.1:${HONEYPOT_WEB_PORT:-18080}:8080"
    environment:
      DECOY_PORT: "8080"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      honeypot-web:
        ipv4_address: 172.31.0.20
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.50"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  honeypot-ssh:
    name: highwall-honeypot-ssh
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  honeypot-web:
    name: highwall-honeypot-web
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
