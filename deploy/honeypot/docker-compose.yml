name: highwall-honeypot

services:
  ssh-live:
    build:
      context: ./ssh
      args:
        HONEYPOT_SSH_PASSWORD: ${HONEYPOT_SSH_PASSWORD:-highwall-decoy-only}
    container_name: highwall-honeypot-ssh
    expose:
      - "2222"
    networks:
      honeypot-ssh:
        ipv4_address: 172.30.0.10
    init: true
    read_only: true
    tmpfs:
      - /run:size=16m,mode=755
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web-live:
    build:
      context: ./web
    container_name: highwall-honeypot-web
    expose:
      - "8080"
    environment:
      DECOY_PORT: "8080"
      LISTEN_HOST: "0.0.0.0"
      DECOY_MAX_CONNECTIONS: "${HONEYPOT_WEB_MAX_CONNECTIONS:-32}"
      DECOY_IDLE_TIMEOUT_SECONDS: "${HONEYPOT_WEB_IDLE_TIMEOUT_SECONDS:-30}"
      DECOY_MAX_CONNECTION_SECONDS: "${HONEYPOT_WEB_MAX_CONNECTION_SECONDS:-120}"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      honeypot-web:
        ipv4_address: 172.31.0.20
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 128m
    cpus: "0.50"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ssh-forward:
    build:
      context: ./relay
    image: highwall-honeypot-relay
    container_name: highwall-honeypot-ssh-forward
    depends_on:
      - ssh-live
    ports:
      - "127.0.0.1:${HONEYPOT_SSH_PORT:-12222}:2222"
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "2222"
      TARGET_HOST: "172.30.0.10"
      TARGET_PORT: "2222"
      MAX_CONNECTIONS: "${HONEYPOT_RELAY_MAX_CONNECTIONS:-64}"
      MAX_CONNECTIONS_PER_IP: "${HONEYPOT_RELAY_MAX_CONNECTIONS_PER_IP:-16}"
      IDLE_TIMEOUT_SECONDS: "${HONEYPOT_RELAY_IDLE_TIMEOUT_SECONDS:-300}"
      MAX_CONNECTION_SECONDS: "${HONEYPOT_RELAY_MAX_CONNECTION_SECONDS:-3600}"
      MAX_BYTES_PER_DIRECTION: "${HONEYPOT_RELAY_MAX_BYTES_PER_DIRECTION:-67108864}"
    networks:
      - honeypot-ssh-edge
      - honeypot-ssh
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web-forward:
    build:
      context: ./relay
    image: highwall-honeypot-relay
    container_name: highwall-honeypot-web-forward
    depends_on:
      - web-live
    ports:
      - "127.0.0.1:${HONEYPOT_WEB_PORT:-18080}:8080"
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "8080"
      TARGET_HOST: "172.31.0.20"
      TARGET_PORT: "8080"
      MAX_CONNECTIONS: "${HONEYPOT_RELAY_MAX_CONNECTIONS:-64}"
      MAX_CONNECTIONS_PER_IP: "${HONEYPOT_RELAY_MAX_CONNECTIONS_PER_IP:-16}"
      IDLE_TIMEOUT_SECONDS: "${HONEYPOT_RELAY_IDLE_TIMEOUT_SECONDS:-300}"
      MAX_CONNECTION_SECONDS: "${HONEYPOT_RELAY_MAX_CONNECTION_SECONDS:-3600}"
      MAX_BYTES_PER_DIRECTION: "${HONEYPOT_RELAY_MAX_BYTES_PER_DIRECTION:-67108864}"
    networks:
      - honeypot-web-edge
      - honeypot-web
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  honeypot-ssh:
    name: highwall-honeypot-ssh
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  honeypot-web:
    name: highwall-honeypot-web
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  honeypot-ssh-edge:
    name: highwall-honeypot-ssh-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24
  honeypot-web-edge:
    name: highwall-honeypot-web-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
