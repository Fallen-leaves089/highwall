name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing HighWall tag to publish, for example v0.13.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: highwall-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify release channel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate tag and write outputs
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/release_channel.py "$RELEASE_TAG" --prefix v --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify / Python ${{ matrix.python-version }}
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Generate loopback test certificates
        run: python subprojects/l5wall/test_certificates.py

      - name: Compile
        run: python -m compileall -q highwall scripts tests subprojects/l4wall/l4wall subprojects/l4wall/tests subprojects/l4wall/scripts subprojects/l5wall/l5wall subprojects/l5wall/tests subprojects/l5wall/scripts subprojects/l5wall/test_certificates.py deploy/standard/verify.py deploy/standard/upstream/echo.py

      - name: Lint and type check
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check highwall scripts tests
          python -m mypy
          python -m scripts.fuzz_parser --iterations 2000 --seed 20261028

      - name: Test with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report

      - name: L4Wall regression
        if: matrix.python-version == '3.12'
        working-directory: subprojects/l4wall
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check l4wall tests scripts
          python -m mypy l4wall
          python -m l4wall check --config config.example.json

      - name: L5Wall regression
        if: matrix.python-version == '3.12'
        working-directory: subprojects/l5wall
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check l5wall tests test_certificates.py scripts
          python -m mypy l5wall
          python -m l5wall check --config config.example.json

      - name: Validate configurations
        if: matrix.python-version == '3.12'
        run: |
          python -m highwall check -c config.example.json
          python -m highwall check -c config.example.json --strict
          python -m highwall check -c deploy/standard/highwall/config.json
          python -m highwall diff -c config.example.json --candidate config.example.json

  native:
    name: Native / ${{ matrix.os }}
    needs: classify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set Cargo release version
        shell: bash
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: >-
          python scripts/set_release_version.py cargo "$VERSION"
          --manifest subprojects/native-core/Cargo.toml
          --lockfile subprojects/native-core/Cargo.lock
          --package highwall-native-core

      - name: Install Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Install SBOM generator
        run: cargo install --locked cargo-cyclonedx --version 0.5.10

      - name: Format and static analysis
        working-directory: subprojects/native-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Native tests
        working-directory: subprojects/native-core
        run: cargo test --all-targets --locked

      - name: Build native release twice and prove reproducibility (Linux)
        if: runner.os == 'Linux'
        working-directory: subprojects/native-core
        shell: bash
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/highwall-native-core-${VERSION}-linux-x86_64.first"
          asset="$RUNNER_TEMP/highwall-native-core-${VERSION}-linux-x86_64"
          proof="$RUNNER_TEMP/highwall-native-core-${VERSION}-linux-x86_64.buildproof.json"

          cargo clean --release -p highwall-native-core
          cargo build --release --locked --bin highwall-native-core
          actual="$(target/release/highwall-native-core --version)"
          test "$actual" = "highwall-native-core $VERSION"
          cp target/release/highwall-native-core "$first"

          sleep 2
          cargo clean --release -p highwall-native-core
          cargo build --release --locked --bin highwall-native-core
          cmp "$first" target/release/highwall-native-core
          cp target/release/highwall-native-core "$asset"

          python "$GITHUB_WORKSPACE/scripts/write_build_proof.py" \
            --first "$first" --second "$asset" --output "$proof" \
            --version "$VERSION" --target linux-x86_64 \
            --rustc-version "$(rustc --version)"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"
          echo "PROOF_PATH=$proof" >> "$GITHUB_ENV"

      - name: Build native release twice and prove reproducibility (Windows)
        if: runner.os == 'Windows'
        working-directory: subprojects/native-core
        env:
          RUSTFLAGS: "-C link-arg=/Brepro"
          VERSION: ${{ needs.classify.outputs.version }}
        shell: pwsh
        run: |
          $first = Join-Path $env:RUNNER_TEMP "highwall-native-core-$env:VERSION-windows-x86_64.first.exe"
          $asset = Join-Path $env:RUNNER_TEMP "highwall-native-core-$env:VERSION-windows-x86_64.exe"
          $proof = Join-Path $env:RUNNER_TEMP "highwall-native-core-$env:VERSION-windows-x86_64.buildproof.json"

          cargo clean --release -p highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --bin highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& target/release/highwall-native-core.exe --version).Trim()
          if ($actual -ne "highwall-native-core $env:VERSION") {
            throw "unexpected native version: $actual"
          }
          Copy-Item -LiteralPath target/release/highwall-native-core.exe -Destination $first

          Start-Sleep -Seconds 2
          cargo clean --release -p highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --bin highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath target/release/highwall-native-core.exe -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "native release is not reproducible: $firstHash != $secondHash"
          }
          Copy-Item -LiteralPath target/release/highwall-native-core.exe -Destination $asset

          $rustcVersion = (& rustc --version).Trim()
          python (Join-Path $env:GITHUB_WORKSPACE 'scripts/write_build_proof.py') `
            --first $first --second $asset --output $proof `
            --version $env:VERSION --target windows-x86_64 `
            --rustc-version $rustcVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROOF_PATH=$proof" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate native SBOM (Linux)
        if: runner.os == 'Linux'
        working-directory: subprojects/native-core
        shell: bash
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          stem="highwall-native-core-${VERSION}-linux-x86_64.cdx"
          cargo cyclonedx --format json --override-filename "$stem" --target x86_64-unknown-linux-gnu
          source="$(find . -maxdepth 1 -type f -name "${stem}.json" -print -quit)"
          test -n "$source"
          destination="$RUNNER_TEMP/${stem}.json"
          cp "$source" "$destination"
          python "$GITHUB_WORKSPACE/scripts/normalize_sbom.py" "$destination"
          echo "SBOM_PATH=$destination" >> "$GITHUB_ENV"

      - name: Generate native SBOM (Windows)
        if: runner.os == 'Windows'
        working-directory: subprojects/native-core
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        shell: pwsh
        run: |
          $stem = "highwall-native-core-$env:VERSION-windows-x86_64.cdx"
          cargo cyclonedx --format json --override-filename $stem --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-ChildItem -LiteralPath . -Filter "$stem.json" -File | Select-Object -First 1
          if ($null -eq $source) { throw "cargo-cyclonedx did not produce $stem.json" }
          $destination = Join-Path $env:RUNNER_TEMP "$stem.json"
          Copy-Item -LiteralPath $source.FullName -Destination $destination
          python (Join-Path $env:GITHUB_WORKSPACE 'scripts/normalize_sbom.py') $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SBOM_PATH=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload native release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ runner.os }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.SBOM_PATH }}
            ${{ env.PROOF_PATH }}
          if-no-files-found: error

  release:
    name: Build packages and publish release
    needs: [classify, verify, native]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set Python package release version
        env:
          PACKAGE_VERSION: ${{ needs.classify.outputs.package_version }}
        run: >-
          python scripts/set_release_version.py python "$PACKAGE_VERSION"
          --pyproject pyproject.toml
          --module highwall/__init__.py

      - name: Build Python distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build --sdist --wheel --outdir dist

      - name: Reject secrets, tests, and build residue in distributions
        env:
          PACKAGE_VERSION: ${{ needs.classify.outputs.package_version }}
        run: python scripts/check_dist.py dist --version "$PACKAGE_VERSION"

      - name: Install wheel and check CLI version
        env:
          PACKAGE_VERSION: ${{ needs.classify.outputs.package_version }}
        run: |
          python -m venv "$RUNNER_TEMP/highwall-venv"
          "$RUNNER_TEMP/highwall-venv/bin/pip" install --disable-pip-version-check dist/*.whl
          installed="$("$RUNNER_TEMP/highwall-venv/bin/highwall" --version | awk '{print $2}')"
          test "$installed" = "$PACKAGE_VERSION"
          "$RUNNER_TEMP/highwall-venv/bin/highwall" --version

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: native-assets

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          find native-assets -maxdepth 2 -type f -exec cp {} release-assets/ \;
          cp subprojects/native-core/config.example.json "release-assets/highwall-native-config-${VERSION}.example.json"
          cp THIRD_PARTY_NOTICES.md release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
          push: true

      - name: Verify release asset attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            verified=true
            for artifact in release-assets/*; do
              if ! gh attestation verify "$artifact" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA"; then
                verified=false
                break
              fi
            done
            if [ "$verified" = true ]; then
              exit 0
            fi
            echo "attestation verification attempt $attempt failed; retrying"
            sleep 6
          done
          exit 1

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          notes="docs/RELEASE-v${VERSION}.md"
          notes_en="docs/RELEASE-v${VERSION}.en.md"
          test -f "$notes"
          test -f "$notes_en"
          cat "$notes" > release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          cat "$notes_en" >> release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          printf 'Release assets include SHA-256 checksums, GitHub build provenance attestations, CycloneDX SBOMs, reproducibility proofs, and `THIRD_PARTY_NOTICES.md`. Verify the attached `SHA256SUMS` and attestations before installation.\n' >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          VERSION: ${{ needs.classify.outputs.version }}
          PRERELEASE: ${{ needs.classify.outputs.prerelease }}
          LABEL: ${{ needs.classify.outputs.label }}
        run: |
          title="HighWall $VERSION"
          flags=(--title "$title")
          if [ "$PRERELEASE" = "true" ]; then
            title="HighWall $VERSION ($LABEL)"
            flags=(--title "$title" --prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" release-assets/* --verify-tag --notes-file release-notes.md "${flags[@]}"
          fi
