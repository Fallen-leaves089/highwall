name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing HighWall tag to publish, for example v0.12.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: highwall-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Generate loopback test certificates
        run: python subprojects/l5wall/test_certificates.py

      - name: Compile
        run: python -m compileall -q highwall scripts tests subprojects/l4wall/l4wall subprojects/l4wall/tests subprojects/l4wall/scripts subprojects/l5wall/l5wall subprojects/l5wall/tests subprojects/l5wall/scripts subprojects/l5wall/test_certificates.py deploy/standard/verify.py deploy/standard/upstream/echo.py

      - name: Lint and type check
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check highwall scripts tests
          python -m mypy
          python -m scripts.fuzz_parser --iterations 2000 --seed 20261028

      - name: Test with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report

      - name: L4Wall regression
        if: matrix.python-version == '3.12'
        working-directory: subprojects/l4wall
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check l4wall tests scripts
          python -m mypy l4wall
          python -m l4wall check --config config.example.json

      - name: L5Wall regression
        if: matrix.python-version == '3.12'
        working-directory: subprojects/l5wall
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check l5wall tests test_certificates.py scripts
          python -m mypy l5wall
          python -m l5wall check --config config.example.json

      - name: Validate configurations
        if: matrix.python-version == '3.12'
        run: |
          python -m highwall check -c config.example.json
          python -m highwall check -c config.example.json --strict
          python -m highwall check -c deploy/standard/highwall/config.json
          python -m highwall diff -c config.example.json --candidate config.example.json

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a v<major>.<minor>.<patch> tag, got $tag"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Format and static analysis
        working-directory: subprojects/native-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Native tests
        working-directory: subprojects/native-core
        run: cargo test --all-targets --locked

      - name: Build native release (Linux)
        if: runner.os == 'Linux'
        working-directory: subprojects/native-core
        run: |
          cargo build --release --locked --bin highwall-native-core
          actual="$(target/release/highwall-native-core --version)"
          test "$actual" = "highwall-native-core ${{ steps.version.outputs.version }}"
          asset="$RUNNER_TEMP/highwall-native-core-${{ steps.version.outputs.version }}-linux-x86_64"
          cp target/release/highwall-native-core "$asset"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Build native release (Windows)
        if: runner.os == 'Windows'
        working-directory: subprojects/native-core
        env:
          RUSTFLAGS: "-C link-arg=/Brepro"
        shell: pwsh
        run: |
          cargo build --release --locked --bin highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& target/release/highwall-native-core.exe --version).Trim()
          if ($actual -ne "highwall-native-core ${{ steps.version.outputs.version }}") {
            throw "unexpected native version: $actual"
          }
          $asset = Join-Path $env:RUNNER_TEMP "highwall-native-core-${{ steps.version.outputs.version }}-windows-x86_64.exe"
          Copy-Item -LiteralPath target/release/highwall-native-core.exe -Destination $asset
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload native release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ runner.os }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: Build packages and publish Alpha pre-release
    needs: [verify, native]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and release channel
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a v<major>.<minor>.<patch> tag, got $tag"
            exit 1
          fi
          version="${tag#v}"
          case "$version" in
            0.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build --sdist --wheel --outdir dist

      - name: Reject secrets, tests, and build residue in distributions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/check_dist.py dist --version "$VERSION"

      - name: Install wheel and check CLI version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/highwall-venv"
          "$RUNNER_TEMP/highwall-venv/bin/pip" install --disable-pip-version-check dist/*.whl
          installed="$("$RUNNER_TEMP/highwall-venv/bin/highwall" --version | awk '{print $2}')"
          test "$installed" = "$VERSION"
          "$RUNNER_TEMP/highwall-venv/bin/highwall" --version

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: native-assets

      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          find native-assets -maxdepth 2 -type f -exec cp {} release-assets/ \;
          cp subprojects/native-core/config.example.json "release-assets/highwall-native-config-${{ steps.version.outputs.version }}.example.json"
          cp THIRD_PARTY_NOTICES.md release-assets/
          cd release-assets
          sha256sum highwall-*.whl highwall-*.tar.gz highwall-native-core-* highwall-native-config-* THIRD_PARTY_NOTICES.md > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
          push: true

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/RELEASE-v${VERSION}.md"
          notes_en="docs/RELEASE-v${VERSION}.en.md"
          test -f "$notes"
          test -f "$notes_en"
          cat "$notes" > release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          cat "$notes_en" >> release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          printf 'Release assets include SHA-256 checksums, GitHub build provenance attestations, and `THIRD_PARTY_NOTICES.md`. Verify the attached `SHA256SUMS` before installation.\n' >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          title="HighWall $VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            title="$title (Alpha)"
          fi
          flags=(--latest=false --title "$title")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" release-assets/* --verify-tag --notes-file release-notes.md "${flags[@]}"
          fi
