name: L4Wall Release

on:
  push:
    tags: ["l4wall-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing L4Wall tag to publish, for example l4wall-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: l4wall-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIR: subprojects/l4wall

jobs:
  verify:
    name: Verify / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install static analysis tools
        if: matrix.python-version == '3.12'
        run: python -m pip install --disable-pip-version-check "ruff==0.17.3" "mypy==2.4.1"

      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: python -m unittest discover -s tests -v

      - name: Static checks
        if: matrix.python-version == '3.12'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python -m ruff check l4wall tests scripts
          python -m mypy l4wall
          python -m l4wall check --config config.example.json

  release:
    name: Build packages and publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            l4wall-v*) ;;
            *) echo "::error::expected an l4wall-v* tag, got $tag"; exit 1 ;;
          esac
          version="${tag#l4wall-v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build --sdist --wheel --outdir dist "${{ env.PACKAGE_DIR }}"

      - name: Check artifact names and contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/l4wall-${VERSION}-py3-none-any.whl"
          test -f "dist/l4wall-${VERSION}.tar.gz"
          python "${{ env.PACKAGE_DIR }}/scripts/check_dist.py" dist

      - name: Install wheel and check CLI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/l4wall-venv"
          "$RUNNER_TEMP/l4wall-venv/bin/pip" install --disable-pip-version-check dist/*.whl
          installed="$("$RUNNER_TEMP/l4wall-venv/bin/l4wall" --version | awk '{print $2}')"
          test "$installed" = "$VERSION"
          "$RUNNER_TEMP/l4wall-venv/bin/l4wall" --version
          "$RUNNER_TEMP/l4wall-venv/bin/l4wall" check --config "${{ env.PACKAGE_DIR }}/config.example.json"

      - name: Create checksums
        run: |
          cd dist
          sha256sum l4wall-*.whl l4wall-*.tar.gz > SHA256SUMS

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(head -n 1 "${{ env.PACKAGE_DIR }}/docs/RELEASE-NOTES.md")" = "# L4Wall $VERSION"
          test "$(head -n 1 "${{ env.PACKAGE_DIR }}/docs/RELEASE-NOTES.en.md")" = "# L4Wall $VERSION"
          cp "${{ env.PACKAGE_DIR }}/docs/RELEASE-NOTES.md" release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          cat "${{ env.PACKAGE_DIR }}/docs/RELEASE-NOTES.en.md" >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "L4Wall $VERSION" --notes-file release-notes.md --latest=false
          else
            gh release create "$TAG" dist/* --verify-tag --title "L4Wall $VERSION" --notes-file release-notes.md --latest=false
          fi
