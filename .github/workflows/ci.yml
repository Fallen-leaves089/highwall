name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q highwall scripts tests subprojects/l4wall/l4wall subprojects/l4wall/tests subprojects/l4wall/scripts subprojects/l5wall/l5wall subprojects/l5wall/tests subprojects/l5wall/scripts subprojects/l5wall/test_certificates.py deploy/standard/verify.py deploy/standard/upstream/echo.py
      - name: Lint
        run: python -m ruff check highwall scripts tests
      - name: Type check
        run: python -m mypy
      - name: Parser fuzz smoke
        run: python -m scripts.fuzz_parser --iterations 2000 --seed 20261028
      - name: Test with coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report
      - name: Attack/defense chain acceptance
        run: python -m unittest tests.test_attack_defense -v
      - name: L4Wall tests
        working-directory: subprojects/l4wall
        run: python -m unittest discover -s tests -v
      - name: L4Wall static checks
        working-directory: subprojects/l4wall
        run: |
          python -m ruff check l4wall tests scripts
          python -m mypy l4wall
          python -m l4wall check --config config.example.json
      - name: L5Wall tests
        working-directory: subprojects/l5wall
        run: |
          python test_certificates.py
          python -m unittest discover -s tests -v
      - name: L5Wall static checks
        working-directory: subprojects/l5wall
        run: |
          python -m ruff check l5wall tests test_certificates.py scripts
          python -m mypy l5wall
          python -m l5wall check --config config.example.json
      - name: Validate standard deployment examples
        run: |
          python -m highwall check -c deploy/standard/highwall/config.json
          python -m py_compile deploy/standard/verify.py deploy/standard/upstream/echo.py
      - name: Validate example configuration
        run: python -m highwall check -c config.example.json
      - name: Reject high-risk example configuration changes
        run: python -m highwall check -c config.example.json --strict
      - name: Smoke-test configuration diff
        run: python -m highwall diff -c config.example.json --candidate config.example.json

  l5wall-package:
    name: L5Wall package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0"
          python -m build --sdist --wheel --outdir dist subprojects/l5wall
      - name: Reject secrets and test material
        run: python subprojects/l5wall/scripts/check_dist.py dist
      - name: Install wheel and check CLI
        run: |
          python -m venv "$RUNNER_TEMP/l5wall-venv"
          "$RUNNER_TEMP/l5wall-venv/bin/pip" install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/l5wall-venv/bin/l5wall" --version

  native-core:
    name: Native core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Format
        working-directory: subprojects/native-core
        run: cargo fmt --all -- --check
      - name: Static analysis
        working-directory: subprojects/native-core
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Native tests
        working-directory: subprojects/native-core
        run: cargo test --all-targets --locked
      - name: Verify reproducible native release (Linux)
        if: runner.os == 'Linux'
        working-directory: subprojects/native-core
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          cargo clean --release -p highwall-native-core
          cargo build --release --locked
          cp target/release/highwall-native-core "$RUNNER_TEMP/highwall-native-linux-a"
          sleep 2
          cargo clean --release -p highwall-native-core
          cargo build --release --locked
          cmp "$RUNNER_TEMP/highwall-native-linux-a" target/release/highwall-native-core
      - name: Verify reproducible native release (Windows)
        if: runner.os == 'Windows'
        working-directory: subprojects/native-core
        env:
          RUSTFLAGS: "-C link-arg=/Brepro"
          SOURCE_DATE_EPOCH: "0"
        shell: pwsh
        run: |
          cargo clean --release -p highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/highwall-native-core.exe "$env:RUNNER_TEMP/highwall-native-windows-a.exe"
          Start-Sleep -Seconds 2
          cargo clean --release -p highwall-native-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = (Get-FileHash "$env:RUNNER_TEMP/highwall-native-windows-a.exe" -Algorithm SHA256).Hash
          $second = (Get-FileHash target/release/highwall-native-core.exe -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "native release is not reproducible: $first != $second" }
          Write-Host "reproducible native SHA256: $second"
      - name: L4Wall to native chain acceptance
        env:
          HIGHWALL_RUN_NATIVE_CHAIN: "1"
        run: python -m unittest tests.test_native_chain -v

  native-image:
    name: Native image / build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build standalone native image
        run: docker build --file Dockerfile.native --tag highwall-native-core:ci .
      - name: Check native image entrypoint
        run: docker run --rm highwall-native-core:ci --version
