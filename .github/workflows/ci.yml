name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q highwall scripts tests
      - name: Lint
        run: python -m ruff check highwall scripts tests
      - name: Type check
        run: python -m mypy
      - name: Parser fuzz smoke
        run: python -m scripts.fuzz_parser --iterations 2000 --seed 20261028
      - name: Test with coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report
      - name: Validate example configuration
        run: python -m highwall check -c config.example.json
      - name: Reject high-risk example configuration changes
        run: python -m highwall check -c config.example.json --strict
      - name: Smoke-test configuration diff
        run: python -m highwall diff -c config.example.json --candidate config.example.json
