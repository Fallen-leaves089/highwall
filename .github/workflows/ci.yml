name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q highwall scripts tests
      - name: Lint
        run: python -m ruff check highwall scripts tests
      - name: Type check
        run: python -m mypy
      - name: Parser fuzz smoke
        run: python -m scripts.fuzz_parser --iterations 2000 --seed 20261028
      - name: Test with coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report
      - name: Validate example configuration
        run: python -m highwall check -c config.example.json
      - name: Reject high-risk example configuration changes
        run: python -m highwall check -c config.example.json --strict
      - name: Smoke-test configuration diff
        run: python -m highwall diff -c config.example.json --candidate config.example.json
